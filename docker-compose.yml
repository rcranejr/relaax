services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: relaax
      POSTGRES_PASSWORD: relaax
      POSTGRES_DB: relaax
    ports: ["5432:5432"]
    volumes:
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7
    ports: ["6379:6379"]
